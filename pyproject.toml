[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mateo627"
version = "0.1.0"
description = "Security-focused FastAPI service skeleton with explicit threat-model documentation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mateo627" }]
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.3",
  "pydantic-settings==2.9.1",
  "SQLAlchemy==2.0.40",
  "passlib[bcrypt]==1.7.4",
  "python-jose[cryptography]==3.4.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.11.7",
  "bandit==1.8.3",
  "pip-audit==2.8.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S105", "B008"]
